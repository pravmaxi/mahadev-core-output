<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Trading App{% endblock %}</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a313c;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --good:#3fb950; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);
       font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}

  /* top nav */
  header{background:var(--panel);border-bottom:1px solid var(--border);
         padding:0 18px;display:flex;align-items:center;gap:4px;height:48px;flex-shrink:0}
  header .brand{font-weight:600;font-size:14px;margin-right:22px;color:var(--fg)}
  header .brand span{color:var(--accent)}
  nav{display:flex;gap:2px;height:100%}
  nav a{display:flex;align-items:center;padding:0 16px;color:var(--muted);
        text-decoration:none;font-size:13px;border-bottom:2px solid transparent;
        transition:.12s}
  nav a:hover{color:var(--fg)}
  nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
  header .spacer{flex:1}
  header .pill{padding:3px 9px;border-radius:20px;background:var(--panel2);
        border:1px solid var(--border);color:var(--muted);font-size:11px}

  /* main content */
  main{flex:1;overflow:auto;padding:18px 22px}
  h1{margin:0 0 4px;font-size:20px;font-weight:600}
  h1 + p.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
</style>
{% block head %}{% endblock %}
</head>
<body>

<header>
  <div class="brand">Mahadev <span>·</span> Trading</div>
  <nav>
    <a href="/scanner"  class="{{ 'active' if active=='scanner'  else '' }}">Scanner</a>
    <a href="/backtest" class="{{ 'active' if active=='backtest' else '' }}">Backtest</a>
    <a href="/broker"   class="{{ 'active' if active=='broker'   else '' }}">Broker</a>
    <a href="/trading"  class="{{ 'active' if active=='trading'  else '' }}">Trading</a>
    <a href="/settings" class="{{ 'active' if active=='settings' else '' }}">Settings</a>
  </nav>
  <div class="spacer"></div>
  <div class="pill">local</div>
</header>

<main>
{% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
